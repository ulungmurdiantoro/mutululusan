# Nginx reverse proxy untuk mutululusan.id (host Debian 13).
# Salin ke /etc/nginx/sites-available/mutululusan.id lalu symlink ke
# sites-enabled. Jalankan certbot --nginx untuk menambah blok HTTPS (443).

server {
    listen 80;
    listen [::]:80;
    server_name mutululusan.id www.mutululusan.id;

    # Ukuran upload (mis. bila nanti ada unggah bukti/dokumen).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
